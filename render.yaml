services:
  - type: web
    name: personal-task-manager
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: personal-task-manager-db
          property: connectionString
      - key: FLASK_ENV
        value: production

databases:
  - name: personal-task-manager-db
    plan: free
