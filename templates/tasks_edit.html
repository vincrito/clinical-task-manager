{% extends "layout.html" %}                                                          <!-- base layout -->

{% block content %}
<h2 class="mb-3">Edit Task</h2>                                                     <!-- page title -->

<form method="post" action="{{ url_for('tasks.update_task', tid=task.id) }}" class="row g-3"> <!-- submit to POST edit -->
  <div class="col-md-8">
    <label class="form-label">Description</label>                                   <!-- label -->
    <input name="description" class="form-control" value="{{ task.description }}" required> <!-- current description -->
  </div>

  <div class="col-md-4">
    <label class="form-label">Due date</label>                                      <!-- label -->
    <input name="due_date" type="date" class="form-control"
           value="{{ task.due_date }}">                                             <!-- ISO prefill; calendar shows it -->
    <div class="form-text">You can also type MM/DD/YY.</div>                        <!-- helper -->
  </div>

  <div class="col-md-6">
    <label class="form-label">Patient</label>                                       <!-- label -->
    <select name="patient_id" class="form-select" required>                         <!-- dropdown of patients -->
      {% for p in patients %}
        <option value="{{ p.id }}" {{ 'selected' if p.id == task.patient_id else '' }}>  <!-- preselect current -->
          {{ (p.last_name or '') ~ (', ' ~ p.first_name if p.first_name) }}         <!-- LAST, First -->
          {% if p.mrn %} (MRN {{ p.mrn }}){% endif %}                               <!-- MRN if present -->
        </option>
      {% endfor %}
    </select>
  </div>

  <div class="col-md-6">
    <label class="form-label">Status</label>                                        <!-- label -->
    <select name="status" class="form-select" required>                             <!-- status select -->
      <option value="pending" {{ 'selected' if task.status=='pending' else '' }}>Pending</option>          <!-- pending -->
      <option value="in_progress" {{ 'selected' if task.status=='in_progress' else '' }}>In Progress</option> <!-- in prog -->
      <option value="completed" {{ 'selected' if task.status=='completed' else '' }}>Completed</option>     <!-- completed -->
    </select>
  </div>

  <div class="col-12">
    <button class="btn btn-primary">Save</button>                                   <!-- submit -->
    <a class="btn btn-link" href="{{ url_for('tasks.list_tasks') }}">Cancel</a>     <!-- cancel -->
  </div>
</form>
{% endblock %}
