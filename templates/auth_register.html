{% extends "layout.html" %}                                 <!-- reuse base layout -->

{% block content %}
<div class="row justify-content-center">                    <!-- center the form -->
  <div class="col-md-6">
    <h2 class="mb-3">Register</h2>                          <!-- page title -->
    <form method="post" action="{{ url_for('auth.register_post') }}"> <!-- POST to register handler -->
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input name="username" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input name="password" type="password" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input name="confirm" type="password" class="form-control" required>
      </div>

      <button class="btn btn-primary">Create account</button>
      <a class="btn btn-link" href="{{ url_for('auth.login') }}">Back to login</a>
    </form>
  </div>
</div>
{% endblock %}
