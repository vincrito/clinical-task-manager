{% extends "layout.html" %}

{% block content %}
<div style="max-width:640px; margin:0 auto; padding:0 1rem 2rem;">

  <h2 class="mb-4" style="font-size:1.4em; font-weight:600; color:#2c3e50;">New Task</h2>

  <form method="post" action="{{ url_for('tasks.create_task') }}" class="row g-3" autocomplete="off">
    <div class="col-12">
      <label class="form-label fw-semibold">Description <span class="text-danger">*</span></label>
      <input name="description" class="form-control" required autocapitalize="sentences" autocorrect="on" spellcheck="true">
    </div>

    <div class="col-md-6">
      <label class="form-label fw-semibold">List <span class="text-danger">*</span></label>
      <select name="list_id" class="form-select" required>
        <option value="">— Select list —</option>
        {% for lst in lists %}
          <option value="{{ lst.id }}" {{ 'selected' if pre_lid|int == lst.id }}>{{ lst.name }}</option>
        {% endfor %}
      </select>
      <div class="form-text"><a href="{{ url_for('lists.new_list') }}">Add a new list</a></div>
    </div>

    <div class="col-md-6">
      <label class="form-label fw-semibold">Priority</label>
      <select name="priority" class="form-select">
        <option value="low" selected>Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
    </div>

    <!-- Recurring toggle -->
    <div class="col-12">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="recurring" id="recurringCheck" value="1"
               {{ 'checked' if pre_recurring }}>
        <label class="form-check-label" for="recurringCheck">Recurring task</label>
      </div>
    </div>

    <!-- Fields shown only for non-recurring tasks -->
    <div id="nonRecurringFields" class="col-12">
      <label class="form-label fw-semibold">Due date</label>
      <input name="due_date" type="date" class="form-control" autocomplete="off">
    </div>

    <!-- Fields shown only for recurring tasks -->
    <div id="recurringFields" style="display:none;" class="col-12">
      <div class="row g-2">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Frequency <span class="text-danger">*</span></label>
          <select name="frequency" class="form-select">
            <option value="daily">Daily</option>
            <option value="weekly" selected>Weekly</option>
            <option value="biweekly">Every two weeks</option>
            <option value="monthly">Monthly</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Starting <span class="text-danger">*</span></label>
          <input name="start_date" type="date" class="form-control" autocomplete="off">
        </div>
      </div>
      <div class="form-text mt-1">
        An occurrence will be created for every scheduled date up to today. Future occurrences are generated automatically each time you view your tasks.
      </div>
    </div>

    <div class="col-12 mt-2">
      <button class="btn btn-primary">Create Task</button>
      <a class="btn btn-link text-muted" href="{{ url_for('tasks.list_tasks') }}">Cancel</a>
    </div>
  </form>

</div>
<script>
(function () {
  var chk = document.getElementById('recurringCheck');
  var nrf = document.getElementById('nonRecurringFields');
  var rf  = document.getElementById('recurringFields');
  function toggle() {
    if (chk.checked) {
      nrf.style.display = 'none';
      rf.style.display  = '';
    } else {
      nrf.style.display = '';
      rf.style.display  = 'none';
    }
  }
  chk.addEventListener('change', toggle);
  toggle(); // initial state
})();
</script>
{% endblock %}
