{% extends "layout.html" %}                                                           <!-- base layout -->

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">                 <!-- header row -->
  <h2 class="mb-0">Patients</h2>                                                     <!-- title -->
  <a class="btn btn-primary" href="{{ url_for('patients.new_patient') }}">New</a>    <!-- new button -->
</div>

<form class="row g-2 mb-3" method="get" action="{{ url_for('patients.list_patients') }}"> <!-- search form -->
  <div class="col-auto">
    <input class="form-control" name="q" placeholder="Search name or MRN" value="{{ q or '' }}"> <!-- query box -->
  </div>
  <div class="col-auto">
    <button class="btn btn-outline-secondary">Search</button>                        <!-- submit -->
  </div>
</form>

<table class="table table-sm align-middle">                                          <!-- results table -->
  <thead><tr>
    <th>Name</th><th>MRN</th><th>DOB</th><th></th>                                   <!-- headers -->
  </tr></thead>
  <tbody>
    {% for p in patients %}                                                          <!-- loop rows -->
      <tr>
        <td>{{ (p.last_name or '') ~ (', ' ~ p.first_name if p.first_name) }}</td>   <!-- Last, First -->
        <td>{{ p.mrn or '' }}</td>                                                   <!-- MRN -->
        <td>{{ p.dob or '' }}</td>                                                   <!-- DOB -->
        <td class="text-end">
          <a class="btn btn-sm btn-outline-primary" href="{{ url_for('patients.patient_detail', pid=p.id) }}">Open</a>  <!-- open -->
          <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('patients.edit_patient', pid=p.id) }}">Edit</a>  <!-- edit -->
        </td>
      </tr>
    {% else %}
      <tr><td colspan="4" class="text-muted">No patients yet.</td></tr>              <!-- empty state -->
    {% endfor %}
  </tbody>
</table>
{% endblock %}
