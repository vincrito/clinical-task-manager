{% extends "layout.html" %}                                                             <!-- base layout -->

{% block content %}
<h2 class="mb-3">New Patient</h2>                                                       <!-- title -->
<form method="post" action="{{ url_for('patients.create_patient') }}" class="row g-3" autocomplete="off">   <!-- POST to create -->
  <div class="col-md-4">
    <label class="form-label">Last name</label>                                         <!-- last name -->
    <input name="last_name" class="form-control" autocomplete="off">
  </div>
  <div class="col-md-4">
    <label class="form-label">First name</label>                                        <!-- first name -->
    <input name="first_name" class="form-control" autocomplete="off">
  </div>
  <div class="col-md-4">
    <label class="form-label">MRN (optional)</label>                                    <!-- MRN -->
    <input name="mrn" class="form-control" autocomplete="off">
  </div>
  <div class="col-md-4">
    <label class="form-label">DOB (YYYY-MM-DD, optional)</label>                        <!-- DOB -->
    <input name="dob" type="text" placeholder="YYYY-MM-DD" class="form-control">
  </div>
  <div class="col-12">
    <button class="btn btn-primary">Create</button>                                     <!-- submit -->
    <a class="btn btn-link" href="{{ url_for('patients.list_patients') }}">Cancel</a>   <!-- cancel -->
  </div>
</form>
{% endblock %}
